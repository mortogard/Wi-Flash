<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Wi-Flash PRO - Smart Flasher Controller</title>
    <meta name="description" content="Progressive Web App smart flasher controller dengan 30 mode kedipan, pengaturan kecepatan PWM, dan integrasi Modul Wi-Flash." />
    <meta property="og:title" content="Wi-Flash PRO - Smart Flasher Controller" />
    <meta property="og:description" content="Progressive Web App smart flasher controller dengan 30 mode kedipan, pengaturan kecepatan PWM, dan integrasi Modul Wi-Flash." />
    <meta name="theme-color" content="#07090e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wi-Flash PRO" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#07090e] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[Wi-Flash SW] PWA Service Worker terdaftar:', reg.scope))
            .catch((err) => console.warn('[Wi-Flash SW] Registrasi SW gagal:', err));
        });
      }
    </script>
  </body>
</html>
